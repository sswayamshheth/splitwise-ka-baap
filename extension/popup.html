<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 360px; margin: 0; font: 13px/1.45 system-ui, sans-serif; color: #0e1e1b; background: #ebfef6; }
      header { background: #1e6f64; color: #fff; padding: 12px 14px; font-weight: 700; font-size: 15px; }
      main { padding: 12px 14px; }
      label { display: block; font-size: 12px; color: #3f4946; margin-top: 10px; }
      #pair input { font: 13px system-ui; border: 1px solid #bec9c5; border-radius: 8px; padding: 7px 9px; width: 100%; box-sizing: border-box; margin-top: 4px; background: #fff; }
      #pair button, #unpair { font: 600 13px system-ui; background: #1e6f64; color: #fff; border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer; width: 100%; margin-top: 10px; }
      #unpair { background: #dff2eb; color: #00564c; }
      .muted { color: #3f4946; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>🧭 GroupTrip · who should pay?</header>
    <main>
      <div id="pair">
        <div class="muted">Pair once: in GroupTrip open <b>Profile → Connect browser extension</b> and paste the token here.</div>
        <label>GroupTrip address (your deployed app, or http://localhost:3000)<input id="server" value="http://localhost:3000" /></label>
        <label>Pairing token<input id="token" placeholder="gtx_…" /></label>
        <button id="save">Pair extension</button>
      </div>
      <div id="app" hidden>
        <div id="advisor"></div>
        <button id="unpair">Unpair</button>
      </div>
      <div id="msg" class="muted" style="margin-top: 8px"></div>
    </main>
    <script src="advisor.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
